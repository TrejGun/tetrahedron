# CI runs on Node.js 24.x
name: CI Test

on:
  workflow_dispatch:
  # Pushes to default branch only (feature branches are covered by pull_request — avoids duplicate runs per commit)
  push:
    branches:
      - master
  # PRs targeting `master`
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install Packages
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Run tests
        run: npm test
